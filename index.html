<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Registration Form</title>
    <style>
        /* CSS Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Unique Geometric Grid Pattern Background */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* Professional Dark Slate Base */
            background-color: #0f172a; 
            /* Subtle CSS Grid Pattern */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* The Main Registration Box */
        .registration-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            border-radius: 12px;
            /* Deep, soft shadow for 3D depth */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            /* Indigo top border accent */
            border-top: 6px solid #4f46e5;
            position: relative;
        }

        /* Header Styling */
        .registration-container h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .registration-container p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        /* Form Grouping */
        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4b5563;
        }

        /* Input Field Styling */
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            color: #111827;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        /* Input Hover and Focus Effects */
        .input-group input:hover {
            border-color: #d1d5db;
            background-color: #ffffff;
        }

        .input-group input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Submit Button Styling */
        .submit-btn {
            width: 100%;
            /* Professional Indigo Gradient */
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* Button Interactions */
        .submit-btn:hover {
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
            transform: translateY(-1px);
        }
        
        .submit-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>

    <div class="registration-container">
        <h2>Join the Platform</h2>
        <p class="subtitle">Enter your details to create your workspace.</p>
        
        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Francis Doe" required>
            </div>

            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
            
        </form>
    </div>

</body>
</html>
